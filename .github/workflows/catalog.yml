name: Weekly radio catalog
on:
  schedule:
    - cron: '17 0 * * 1' # Monday 09:17 KST
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: catalog-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get previous published catalog
        run: |
          mkdir -p previous
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "$latest" ]]; then
            gh release download "$latest" -p manifest.json -p world.json.gz -D previous
            jq -r '.files.world.sha256 + "  previous/world.json.gz"' previous/manifest.json | sha256sum --check
          else
            cp data/world_seed.json.gz previous/world.json.gz
          fi
      - name: Download and validate Radio Browser snapshot
        run: |
          tag="catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CATALOG_TAG=$tag" >> "$GITHUB_ENV"
          for host in de1.api.radio-browser.info nl1.api.radio-browser.info at1.api.radio-browser.info; do
            if curl --fail --silent --show-error --location --compressed --max-time 160 --retry 1 -A 'CatRadioCatalog/1.0 (github.com/PigeonLabs/cat-radio-catalog)' "https://$host/json/stations" -o snapshot.json &&
              python3 build_catalog.py snapshot.json --previous previous/world.json.gz --tag "$tag"; then
              exit 0
            fi
          done
          exit 1
      - name: Publish changed assets together
        run: |
          if [[ -e previous/manifest.json ]] && diff -q <(jq -S '.files | map_values(.sha256)' previous/manifest.json) <(jq -S '.files | map_values(.sha256)' dist/manifest.json); then
            echo "Catalog unchanged"
            exit 0
          fi
          gh release create "$CATALOG_TAG" --draft --target "$GITHUB_SHA" --title "$CATALOG_TAG" --notes '검증된 국내·해외 방송국 카탈로그' dist/manifest.json dist/kr.json.gz dist/world.json.gz
          gh release edit "$CATALOG_TAG" --draft=false --latest
